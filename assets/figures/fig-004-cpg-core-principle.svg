<svg width="1400" height="900" viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#0B0F1A"/>
            <stop offset="100%" stop-color="#131C30"/>
        </linearGradient>
        <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#4DA3FF"/>
        </marker>
        <style>
            .title { font: 700 30px Arial, Helvetica, sans-serif; fill: #FFFFFF; }
            .subtitle { font: 16px Arial, Helvetica, sans-serif; fill: #B8C0D0; }
            .boxTitle { font: 700 18px Arial, Helvetica, sans-serif; fill: #FFFFFF; }
            .boxText { font: 13px Arial, Helvetica, sans-serif; fill: #D9E1EE; }
            .formula { font: 700 22px Arial, Helvetica, sans-serif; fill: #4DA3FF; }
            .small { font: 12px Arial, Helvetica, sans-serif; fill: #B8C0D0; }
        </style>
    </defs>

    <rect width="1400" height="900" fill="url(#bg)"/>

    <text x="700" y="70" text-anchor="middle" class="title">CCC-Preserved Generation — Core Principle</text>
    <text x="700" y="102" text-anchor="middle" class="subtitle">
        Generation is not free-form output; it is transformation constrained by structural invariants.
    </text>

    <rect x="360" y="145" width="680" height="86" rx="18" fill="#111827" stroke="#4DA3FF" stroke-width="1.5"/>
    <text x="700" y="198" text-anchor="middle" class="formula">CCC(G(x)) = CCC(x) + Δ_allowed</text>

    <!-- Pipeline -->
    <g>
        <rect x="90" y="320" width="210" height="160" rx="20" fill="#1B2233" stroke="#5A657A"/>
        <text x="195" y="370" text-anchor="middle" class="boxTitle">Input</text>
        <text x="195" y="402" text-anchor="middle" class="boxText">Raw prompt / state /</text>
        <text x="195" y="422" text-anchor="middle" class="boxText">object / trajectory</text>
    </g>

    <g>
        <rect x="355" y="300" width="250" height="200" rx="22" fill="#1B2233" stroke="#4DA3FF" stroke-width="2"/>
        <text x="480" y="350" text-anchor="middle" class="boxTitle">CCC Extraction</text>
        <text x="480" y="386" text-anchor="middle" class="boxText">Identify invariant structure</text>
        <text x="480" y="408" text-anchor="middle" class="boxText">concept core / stable pattern</text>
        <text x="480" y="430" text-anchor="middle" class="boxText">target-preserving identity</text>
        <rect x="410" y="448" width="140" height="30" rx="10" fill="#0F172A" stroke="#4DA3FF"/>
        <text x="480" y="468" text-anchor="middle" class="small">CCC(x)</text>
    </g>

    <g>
        <rect x="660" y="280" width="280" height="240" rx="24" fill="#1B2233" stroke="#4DA3FF" stroke-width="2"/>
        <text x="800" y="330" text-anchor="middle" class="boxTitle">Constrained Generator</text>
        <text x="800" y="366" text-anchor="middle" class="boxText">Generate under invariant bounds</text>
        <text x="800" y="388" text-anchor="middle" class="boxText">allow refinement but prevent</text>
        <text x="800" y="410" text-anchor="middle" class="boxText">destructive structural drift</text>

        <rect x="706" y="438" width="188" height="32" rx="10" fill="#0F172A" stroke="#4DA3FF"/>
        <text x="800" y="460" text-anchor="middle" class="small">Preservation constraint</text>
    </g>

    <g>
        <rect x="1010" y="320" width="300" height="160" rx="20" fill="#1B2233" stroke="#5A657A"/>
        <text x="1160" y="370" text-anchor="middle" class="boxTitle">Generated Output</text>
        <text x="1160" y="402" text-anchor="middle" class="boxText">Surface may change,</text>
        <text x="1160" y="422" text-anchor="middle" class="boxText">CCC must remain preserved</text>
    </g>

    <!-- Arrows -->
    <line x1="300" y1="400" x2="355" y2="400" stroke="#4DA3FF" stroke-width="3" marker-end="url(#arrowBlue)"/>
    <line x1="605" y1="400" x2="660" y2="400" stroke="#4DA3FF" stroke-width="3" marker-end="url(#arrowBlue)"/>
    <line x1="940" y1="400" x2="1010" y2="400" stroke="#4DA3FF" stroke-width="3" marker-end="url(#arrowBlue)"/>

    <!-- Bottom compare panels -->
    <rect x="150" y="610" width="470" height="190" rx="20" fill="#111827" stroke="#5A657A"/>
    <text x="385" y="655" text-anchor="middle" class="boxTitle">Traditional Generative View</text>
    <text x="385" y="695" text-anchor="middle" class="boxText">Generate plausible output</text>
    <text x="385" y="720" text-anchor="middle" class="boxText">Optimize fluency / likelihood</text>
    <text x="385" y="745" text-anchor="middle" class="boxText">Weak control over preserved structure</text>

    <rect x="780" y="610" width="470" height="190" rx="20" fill="#111827" stroke="#4DA3FF" stroke-width="2"/>
    <text x="1015" y="655" text-anchor="middle" class="boxTitle">CCC-Preserved View</text>
    <text x="1015" y="695" text-anchor="middle" class="boxText">Generate while preserving CCC</text>
    <text x="1015" y="720" text-anchor="middle" class="boxText">Optimize structural consistency</text>
    <text x="1015" y="745" text-anchor="middle" class="boxText">Enable reuse, stability, and accumulation</text>
</svg>