<svg width="1400" height="900" viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#0B0F1A"/>
            <stop offset="100%" stop-color="#1A1620"/>
        </linearGradient>
        <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#FF9F4D"/>
        </marker>
        <style>
            .title { font: 700 30px Arial, Helvetica, sans-serif; fill: #FFFFFF; }
            .subtitle { font: 16px Arial, Helvetica, sans-serif; fill: #B8C0D0; }
            .boxTitle { font: 700 18px Arial, Helvetica, sans-serif; fill: #FFFFFF; }
            .boxText { font: 13px Arial, Helvetica, sans-serif; fill: #D9E1EE; }
            .formula { font: 700 22px Arial, Helvetica, sans-serif; fill: #FF9F4D; }
            .small { font: 12px Arial, Helvetica, sans-serif; fill: #B8C0D0; }
        </style>
    </defs>

    <rect width="1400" height="900" fill="url(#bg)"/>

    <text x="700" y="70" text-anchor="middle" class="title">Actionable Metric Space — Core Principle</text>
    <text x="700" y="102" text-anchor="middle" class="subtitle">
        Distance becomes intelligence only when it is transformed into signal, scoring, and decision.
    </text>

    <rect x="380" y="145" width="640" height="86" rx="18" fill="#111827" stroke="#FF9F4D" stroke-width="1.5"/>
    <text x="700" y="198" text-anchor="middle" class="formula">d(x, y) → Signal(x, y) → Score → Decision → Policy</text>

    <!-- pipeline -->
    <g>
        <rect x="60" y="320" width="180" height="180" rx="18" fill="#1B2233" stroke="#FF9F4D"/>
        <text x="150" y="372" text-anchor="middle" class="boxTitle">Metric Space</text>
        <text x="150" y="408" text-anchor="middle" class="boxText">Points / objects /</text>
        <text x="150" y="430" text-anchor="middle" class="boxText">states embedded</text>
        <text x="150" y="452" text-anchor="middle" class="boxText">in comparable space</text>
    </g>

    <g>
        <rect x="285" y="320" width="180" height="180" rx="18" fill="#1B2233" stroke="#FF9F4D"/>
        <text x="375" y="372" text-anchor="middle" class="boxTitle">Distance</text>
        <text x="375" y="408" text-anchor="middle" class="boxText">Compute relation</text>
        <text x="375" y="430" text-anchor="middle" class="boxText">similarity / divergence</text>
        <text x="375" y="452" text-anchor="middle" class="boxText">proximity / targeting</text>
    </g>

    <g>
        <rect x="510" y="320" width="180" height="180" rx="18" fill="#1B2233" stroke="#FF9F4D"/>
        <text x="600" y="372" text-anchor="middle" class="boxTitle">Signal</text>
        <text x="600" y="408" text-anchor="middle" class="boxText">Interpret distance</text>
        <text x="600" y="430" text-anchor="middle" class="boxText">as actionable evidence</text>
        <text x="600" y="452" text-anchor="middle" class="boxText">for downstream choice</text>
    </g>

    <g>
        <rect x="735" y="320" width="180" height="180" rx="18" fill="#1B2233" stroke="#FF9F4D"/>
        <text x="825" y="372" text-anchor="middle" class="boxTitle">Scoring</text>
        <text x="825" y="408" text-anchor="middle" class="boxText">Rank / rerank /</text>
        <text x="825" y="430" text-anchor="middle" class="boxText">weigh alternatives</text>
        <text x="825" y="452" text-anchor="middle" class="boxText">by objective criteria</text>
    </g>

    <g>
        <rect x="960" y="320" width="180" height="180" rx="18" fill="#1B2233" stroke="#FF9F4D"/>
        <text x="1050" y="372" text-anchor="middle" class="boxTitle">Decision</text>
        <text x="1050" y="408" text-anchor="middle" class="boxText">Select route / target /</text>
        <text x="1050" y="430" text-anchor="middle" class="boxText">match / response</text>
        <text x="1050" y="452" text-anchor="middle" class="boxText">under constraints</text>
    </g>

    <g>
        <rect x="1185" y="320" width="155" height="180" rx="18" fill="#1B2233" stroke="#FF9F4D"/>
        <text x="1262.5" y="372" text-anchor="middle" class="boxTitle">Policy</text>
        <text x="1262.5" y="408" text-anchor="middle" class="boxText">Apply risk /</text>
        <text x="1262.5" y="430" text-anchor="middle" class="boxText">goal / profile</text>
        <text x="1262.5" y="452" text-anchor="middle" class="boxText">constraints</text>
    </g>

    <!-- arrows -->
    <line x1="240" y1="410" x2="285" y2="410" stroke="#FF9F4D" stroke-width="3" marker-end="url(#arrowOrange)"/>
    <line x1="465" y1="410" x2="510" y2="410" stroke="#FF9F4D" stroke-width="3" marker-end="url(#arrowOrange)"/>
    <line x1="690" y1="410" x2="735" y2="410" stroke="#FF9F4D" stroke-width="3" marker-end="url(#arrowOrange)"/>
    <line x1="915" y1="410" x2="960" y2="410" stroke="#FF9F4D" stroke-width="3" marker-end="url(#arrowOrange)"/>
    <line x1="1140" y1="410" x2="1185" y2="410" stroke="#FF9F4D" stroke-width="3" marker-end="url(#arrowOrange)"/>

    <!-- lower panels -->
    <rect x="120" y="610" width="500" height="180" rx="20" fill="#111827" stroke="#5A657A"/>
    <text x="370" y="655" text-anchor="middle" class="boxTitle">Mathematical Metric Space</text>
    <text x="370" y="695" text-anchor="middle" class="boxText">Distance is valid as definition</text>
    <text x="370" y="720" text-anchor="middle" class="boxText">but may remain computationally inert</text>
    <text x="370" y="745" text-anchor="middle" class="boxText">if it never influences action</text>

    <rect x="780" y="610" width="500" height="180" rx="20" fill="#111827" stroke="#FF9F4D" stroke-width="2"/>
    <text x="1030" y="655" text-anchor="middle" class="boxTitle">DBM-SI Actionable Metric Space</text>
    <text x="1030" y="695" text-anchor="middle" class="boxText">Distance is transformed into signal</text>
    <text x="1030" y="720" text-anchor="middle" class="boxText">signal is transformed into decision</text>
    <text x="1030" y="745" text-anchor="middle" class="boxText">decision is shaped by policy and goals</text>
</svg>