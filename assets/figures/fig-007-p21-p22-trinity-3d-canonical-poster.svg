<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#0B0F1A"/>
            <stop offset="100%" stop-color="#182234"/>
        </linearGradient>
        <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#4DA3FF"/>
        </marker>
        <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#FF9F4D"/>
        </marker>
        <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#FFD24D"/>
        </marker>
        <style>
            .title { font: 700 34px Arial, Helvetica, sans-serif; fill: #FFFFFF; }
            .subtitle { font: 18px Arial, Helvetica, sans-serif; fill: #B8C0D0; }
            .axisLabel { font: 700 20px Arial, Helvetica, sans-serif; }
            .small { font: 13px Arial, Helvetica, sans-serif; fill: #D9E1EE; }
            .panelTitle { font: 700 18px Arial, Helvetica, sans-serif; fill: #FFFFFF; }
            .panelText { font: 13px Arial, Helvetica, sans-serif; fill: #D9E1EE; }
        </style>
    </defs>

    <rect width="1600" height="1000" fill="url(#bg)"/>

    <text x="800" y="70" text-anchor="middle" class="title">P21 × P22 × Trinity — 3D Canonical Poster</text>
    <text x="800" y="105" text-anchor="middle" class="subtitle">
        Intelligence as a 3D space of Structure, Action, and Evolution
    </text>

    <!-- 3D axes origin -->
    <circle cx="800" cy="560" r="10" fill="#FFFFFF"/>
    <circle cx="800" cy="560" r="30" fill="#FFFFFF" opacity="0.08"/>

    <!-- Axes -->
    <line x1="800" y1="560" x2="1270" y2="560" stroke="#4DA3FF" stroke-width="4" marker-end="url(#arrowBlue)"/>
    <line x1="800" y1="560" x2="420" y2="230" stroke="#FF9F4D" stroke-width="4" marker-end="url(#arrowOrange)"/>
    <line x1="800" y1="560" x2="800" y2="170" stroke="#FFD24D" stroke-width="4" marker-end="url(#arrowGold)"/>

    <!-- Axis labels -->
    <text x="1295" y="566" class="axisLabel" fill="#4DA3FF">Structure (CCC / P21)</text>
    <text x="255" y="220" class="axisLabel" fill="#FF9F4D">Action (Metric / P22)</text>
    <text x="820" y="158" class="axisLabel" fill="#FFD24D">Evolution (Trajectory)</text>

    <!-- Volume -->
    <polygon points="800,170 1270,560 800,560 420,230"
             fill="#FFFFFF" opacity="0.04" stroke="#B8C0D0" stroke-width="1.5"/>
    <polygon points="800,170 1270,560 980,730 800,560"
             fill="#4DA3FF" opacity="0.05" stroke="#4DA3FF" stroke-width="1"/>
    <polygon points="800,170 420,230 620,760 800,560"
             fill="#FF9F4D" opacity="0.05" stroke="#FF9F4D" stroke-width="1"/>
    <polygon points="800,560 1270,560 980,730 620,760"
             fill="#FFD24D" opacity="0.04" stroke="#FFD24D" stroke-width="1"/>

    <!-- central labels -->
    <rect x="705" y="612" width="190" height="62" rx="18" fill="#111827" stroke="#5A657A"/>
    <text x="800" y="640" text-anchor="middle" class="panelTitle">Intelligence State</text>
    <text x="800" y="660" text-anchor="middle" class="small">non-zero volume in 3D space</text>

    <!-- Interaction labels -->
    <rect x="970" y="390" width="230" height="38" rx="12" fill="#111827" stroke="#4DA3FF"/>
    <text x="1085" y="414" text-anchor="middle" class="small">Structure × Action = Targeting</text>

    <rect x="560" y="310" width="250" height="38" rx="12" fill="#111827" stroke="#FF9F4D"/>
    <text x="685" y="334" text-anchor="middle" class="small">Action × Evolution = Adaptive Decision</text>

    <rect x="880" y="280" width="240" height="38" rx="12" fill="#111827" stroke="#FFD24D"/>
    <text x="1000" y="304" text-anchor="middle" class="small">Structure × Evolution = Growing CCC</text>

    <!-- Trinity panels -->
    <rect x="110" y="785" width="400" height="135" rx="20" fill="#111827" stroke="#4DA3FF"/>
    <text x="310" y="828" text-anchor="middle" class="panelTitle">CCC</text>
    <text x="310" y="858" text-anchor="middle" class="panelText">Defines invariant structure</text>
    <text x="310" y="882" text-anchor="middle" class="panelText">anchors preserved generation</text>

    <rect x="600" y="785" width="400" height="135" rx="20" fill="#111827" stroke="#FFD24D"/>
    <text x="800" y="828" text-anchor="middle" class="panelTitle">Trajectory Intelligence</text>
    <text x="800" y="858" text-anchor="middle" class="panelText">Defines motion through time</text>
    <text x="800" y="882" text-anchor="middle" class="panelText">enables MET-driven evolution</text>

    <rect x="1090" y="785" width="400" height="135" rx="20" fill="#111827" stroke="#FF9F4D"/>
    <text x="1290" y="828" text-anchor="middle" class="panelTitle">Policy &amp; Decision System</text>
    <text x="1290" y="858" text-anchor="middle" class="panelText">Converts signal into action</text>
    <text x="1290" y="882" text-anchor="middle" class="panelText">selects among constrained paths</text>
</svg>